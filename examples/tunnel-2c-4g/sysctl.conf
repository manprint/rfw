# Host tuning for rfw on a high-latency / high-bandwidth path (see docker-compose.yml).
# BBR holds throughput on lossy last miles where cubic collapses; 16 MiB covers the
# bandwidth-delay product of ~1 Gbit/s at 100+ ms. rmem_default/wmem_default give
# UDP sockets (rfw's QUIC/STUN forwarders) a buffer that survives bursts.
net.ipv4.tcp_congestion_control=bbr
net.ipv4.tcp_wmem=4096 65536 16777216
net.ipv4.tcp_rmem=4096 131072 16777216
net.ipv4.tcp_slow_start_after_idle=0
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.core.rmem_default=8388608
net.core.wmem_default=8388608
