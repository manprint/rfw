# rfw in front of a tunnel server, sized for a 2 vCPU / 4 GB VM.
# Choices come from docs/benchmarks/BENCHMARK_REPORT.md (sections 4, 5, 9).
#
#   docker compose up -d
#   curl -s 127.0.0.1:9090/stats        # on the VM
#
# Host ports 80, 443, 7835, 7836 and 30000-30050 (plus 127.0.0.1:9090) must be free.
#
# REQUIRED on the host, once (sysctl.conf next to this file): with host
# networking rfw's sockets live in the HOST network namespace, so the congestion
# control and buffer limits you tuned inside the backend's container (bbr, 16 MiB)
# no longer apply to the client-facing leg, and UDP sockets get the 212 KiB
# net.core.rmem_default. Without it expect slow transfers and QUIC drops
# (nstat -az UdpRcvbufErrors rising).
#   sudo cp sysctl.conf /etc/sysctl.d/99-rfw-tunnel.conf
#   echo tcp_bbr | sudo tee /etc/modules-load.d/bbr.conf
#   sudo modprobe tcp_bbr && sudo sysctl --system
#
# Caveat: rfw is an L4 proxy without PROXY protocol, so the backend sees every
# client as the proxy's address (not the client IP).

services:
  rfw:
    image: ghcr.io/manprint/rfw:v1.2.0
    container_name: rfw-tunnel
    restart: unless-stopped

    # Host network: no docker-proxy (one process per published port and protocol,
    # ~110 here), no NAT hop, no `ports:` list. The image runs as root, so
    # 80/443 bind without extra capabilities.
    network_mode: host

    # All forwarders and settings live in the YAML (hot reload). Mount the
    # directory, not the file: editors replace the inode.
    volumes:
      - ./config:/etc/rfw:ro
    command: ["-f", "/etc/rfw/forwarders.yml", "--log-dir", ""]

    environment:
      - RUST_LOG=info
      - RFW_INSTANCE_NAME=tunnel-edge
      # - RFW_WEBHOOK_URL=${RFW_WEBHOOK_URL}   # Google Chat alerts, from .env

    # Only needed if you enable use_splice in the config: SYS_RESOURCE lifts
    # fs.pipe-user-pages-soft (report section 4.3). Narrow replacement for
    # --privileged, which gains nothing.
    cap_add:
      - SYS_RESOURCE

    # 10000 conns x 6 fds (with splice) + 16384 UDP sessions + headroom.
    ulimits:
      nofile:
        soft: 131072
        hard: 131072

    # 10000 x ~60 KiB ~ 600 MiB, plus socket buffers (charged to the cgroup under
    # cgroup v2: a limit that is too tight throttles the sockets). CPU is left
    # unlimited on purpose: rfw scales with both cores.
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 128M

    stop_grace_period: 15s

    healthcheck:
      test: ["CMD", "/usr/local/bin/rfw", "--health-check", "127.0.0.1:9090"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
