[package]
name = "rfw"
version = "1.0.6"
edition = "2021"
rust-version = "1.89"
description = "Rust Forwarder — TCP port forwarder with hot-reload, auto-reconnect, and dynamic DNS"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
# serde_yaml is unmaintained (0.9.34+deprecated); serde-saphyr is its actively
# maintained, panic-free successor with the same serde-derive surface.
serde-saphyr = "1.3.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
notify = "9.0.0-rc.5"
hickory-resolver = "0.26.3"
# `all` unlocks `TcpKeepalive::with_retries` (TCP_KEEPCNT).
socket2 = { version = "0.6.5", features = ["all"] }
libc = "0.2.186"
anyhow = "1.0.104"
# Webhook alerting (Google Chat). TLS is rustls with the `ring` provider and
# the bundled Mozilla root store: no OpenSSL, no system CA store (the runtime
# image is distroless), and `ring` cross-compiles to every target build.sh
# produces (aws-lc-rs needs cmake/bindgen on several of them).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2", "charset"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.9"
serde_json = "1.0"
url = "2.5.8"

[dev-dependencies]
libc = "0.2.186"
socket2 = { version = "0.6.5", features = ["all"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# NOTE: panic is intentionally left as "unwind" (default). A panic in one
# connection task must stay isolated, not abort the whole multi-forwarder process.
