# ============================================================
# rfw — Forwarder configuration file
#
# Usage:  rfw -f forwarders.yml
# ============================================================

forwarders:
  # Forward local port 8080 to a web server
  - local_host: "127.0.0.1"
    local_port: 8080
    remote_host: "192.168.1.100"
    remote_port: 80

  # Forward local port 3306 to a remote database
  - local_host: "0.0.0.0"
    local_port: 3306
    remote_host: "db-prod.example.com"
    remote_port: 3306

  # Forward local port 443 to a cloud service
  - local_host: "0.0.0.0"
    local_port: 443
    remote_host: "app.azure.com"
    remote_port: 443

  # ── UDP ──
  # Add `protocol: udp` (default: tcp). Each client address gets its own
  # session (one upstream socket) until it stays idle for
  # udp_session_timeout_secs; datagram boundaries are preserved.

  # DNS over UDP: local port 1053 to a public resolver.
  - local_host: "0.0.0.0"
    local_port: 1053
    remote_host: "1.1.1.1"
    remote_port: 53
    protocol: udp

  # DNS over TCP on the same local port: a TCP and a UDP forwarder may share a
  # port (two UDP or two TCP forwarders may not).
  - local_host: "0.0.0.0"
    local_port: 1053
    remote_host: "1.1.1.1"
    remote_port: 53
    protocol: tcp

  # Syslog to a collector by hostname. The name is re-resolved every second;
  # when its addresses change, sessions to the old ones are closed and the
  # next datagram opens a session to the new address.
  - local_host: "0.0.0.0"
    local_port: 5514
    remote_host: "syslog.example.com"
    remote_port: 514
    protocol: udp

  # ── Port ranges ──
  # `local_port_end` turns an entry into a block of ports, mapped port for port:
  # local 30000..30050 -> remote 30000..30050 (51 forwarders). The remote side
  # follows at the same offsets; `remote_port_end` is optional and must span
  # the same number of ports. Works with `protocol: udp` too; at most 4096
  # ports per entry; ranges may not overlap other local ports.
  # - local_host: "0.0.0.0"
  #   local_port: 30000
  #   local_port_end: 30050
  #   remote_host: "tunnel.example.com"
  #   remote_port: 30000

  # WireGuard / QUIC-style bulk UDP: consider `udp_gro_gso: true` below
  # (Linux only) and a larger socket_buffer_bytes.
  # - local_host: "0.0.0.0"
  #   local_port: 51820
  #   remote_host: "vpn.example.com"
  #   remote_port: 51820
  #   protocol: udp

# ------------------------------------------------------------
# Optional runtime settings (all fields optional; defaults shown).
# CLI flags (--metrics-addr, --report-interval, --sample-interval,
# --buffer-bytes, --socket-buffer-bytes, --splice, --max-connections,
# --connect-timeout, --dns-timeout, --keepalive-*, --webhook-url,
# --instance-name, --probe-interval, --unreachable-after,
# --udp-session-timeout, --udp-max-sessions, --udp-gro-gso) override these.
# ------------------------------------------------------------
settings:
  # Enable the HTTP stats endpoint (GET /metrics Prometheus, /stats JSON,
  # GET / health: 200 while every forwarder is bound, 503 otherwise).
  # Omit / null to disable (default: disabled).
  metrics_addr: "127.0.0.1:9090"
  # Periodic traffic-report log cadence, seconds.
  report_interval_secs: 60
  # Throughput-rate (bytes/sec) sampling cadence, seconds.
  sample_interval_secs: 1
  # Per-direction copy buffer size, bytes (hot-reloadable).
  buffer_bytes: 65536
  # Kernel socket buffer size (SO_SNDBUF/SO_RCVBUF) per socket, bytes.
  # Omit / null leaves the OS default; raise it for high-latency (WAN) links.
  # (hot-reloadable)
  # socket_buffer_bytes: 1048576
  # Use the Linux splice(2) zero-copy data path (Linux only, hot-reloadable).
  use_splice: false
  # Cap on concurrently proxied connections across all forwarders.
  # Omit / null for unbounded. Each connection costs ~2 * buffer_bytes of heap,
  # so under a container memory limit this is what prevents an OOM kill.
  # Connections beyond the cap are closed at accept and counted in
  # rfw_rejected_connections_total. (startup only — a change needs a restart)
  # max_connections: 2000
  # Per-address TCP connect timeout, seconds (hot-reloadable). Attempts to a
  # multi-address host are staggered 250ms apart and raced, so a dead first
  # DNS record does not cost a full timeout.
  connect_timeout_secs: 10
  # DNS resolution timeout, seconds (hot-reloadable). IP-literal remotes skip
  # the resolver entirely. Hostnames are resolved per connection, honouring
  # the record TTL, so a remote whose IP changes (cloud DB failover) is picked
  # up by the next connection without a restart.
  dns_timeout_secs: 5
  # TCP keepalive on both sides of every proxied connection (hot-reloadable).
  # Without it a peer that vanishes without closing (client crash, VPN or NAT
  # drop, remote failover) leaves a half-open connection that never ends,
  # holding a max_connections slot, a backend session, and two copy buffers
  # for hours. With these defaults a dead peer is detected in
  # idle + interval * retries = 60 + 10 * 3 = 90s.
  # keepalive_idle_secs: 0 disables keepalive entirely.
  keepalive_idle_secs: 60
  keepalive_interval_secs: 10
  keepalive_retries: 3

  # Seconds a UDP session may stay idle before it is closed (hot-reloadable).
  # Each UDP client address has its own upstream socket until this expires.
  # udp_session_timeout_secs: 60
  # Max concurrent UDP sessions across all UDP forwarders (startup only — a
  # change needs a restart). Datagrams from new clients beyond it are dropped
  # and counted in rfw_rejected_connections_total.
  # udp_max_sessions: 16384
  # Linux only (ignored elsewhere), hot-reloadable. Receive coalesced UDP bursts
  # (UDP_GRO) and forward them with segmented sends (UDP_SEGMENT); datagram
  # boundaries and order are unchanged. Turning it off stops GRO on new sessions;
  # a listener that already has UDP_GRO keeps it until restart.
  # udp_gro_gso: false   # Linux only, hot-reloadable

  # ── Alerting to a Google Chat webhook (startup only — a change needs a restart) ──
  # Sends a message on: startup (with one reachability probe per target), a
  # DNS answer change for a target, a target unreachable for longer than
  # unreachable_after_secs (and its recovery), a local port that cannot be
  # bound (and its recovery), config reload success/failure, max_connections
  # saturation, internal problems, and shutdown.
  # The URL carries the space's credentials (key= and token=): prefer the
  # RFW_WEBHOOK_URL environment variable over writing it into this file.
  # Omit / null to disable (default: disabled).
  # webhook_url: "https://chat.googleapis.com/v1/spaces/AAAA/messages?key=...&token=..."
  # Name shown in every alert; defaults to the hostname.
  # instance_name: "db-proxy-prod"
  # Seconds between active probes of each target: resolve + one TCP connect,
  # closed at once. Skipped while real connections keep succeeding, so a busy
  # forwarder costs the backend no extra connections. (hot-reloadable)
  probe_interval_secs: 30
  # Seconds a target must fail continuously before the "unreachable" alert
  # (default 300 = 5 minutes). Shorter blips are logged, not alerted.
  # (hot-reloadable)
  unreachable_after_secs: 300

# ------------------------------------------------------------
# Notes
#  * Invalid values are rejected at startup with a clear message; on
#    hot-reload they are clamped to the nearest safe value and logged.
#  * A file that fails to parse leaves the running configuration untouched.
# ------------------------------------------------------------
