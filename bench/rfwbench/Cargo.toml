[package]
name = "rfwbench"
version = "0.1.0"
edition = "2021"
description = "Load generator + echo backend for the rfw forwarder benchmark suite (std + libc only)"
publish = false

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Own workspace root: the benchmark crate must not become a member of the rfw
# package (it would change what `cargo test --all` means for the forwarder).
[workspace]
