name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all

      # The e2e suites drive the real binary over real sockets, so several of
      # them are timing-sensitive (shutdown drains, rebind races, connection
      # shedding). A release build changes those timings enough to expose
      # ordering bugs a debug build hides.
      - name: Test (release)
        run: cargo test --all --release
